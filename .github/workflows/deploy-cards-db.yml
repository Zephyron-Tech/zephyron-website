name: Deploy cards DB to VPS

# Wiki "Infrastructure & Deployment Guide" -> CI/CD Pipelines. Same shape as zephyron-deck-microservice:
# build image -> push to GHCR -> SSH to the Hetzner VPS -> provision folder/.env -> compose up.
# Differences: the "app" is Postgres (official image, nothing to build except the migrate image),
# and migrations run on every deploy (`prisma migrate deploy`, idempotent) like MoodTracker.
# The Next.js site itself deploys through Vercel, not through this workflow.
on:
  push:
    branches: [main]
    paths:
      - "deploy/cards-db/**"
      - "prisma/**"
      - "prisma.config.ts"
      - ".github/workflows/deploy-cards-db.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cards-db
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/zephyron-tech/zephyron-cards-migrate
  PROJECT_DIR: /opt/docker/zephyron-cards

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/cards-db/migrate.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Ensure project directory exists on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p ${{ env.PROJECT_DIR }}
            sudo chown "$(whoami):$(whoami)" ${{ env.PROJECT_DIR }}

      - name: Copy compose, pg_hba.conf and fail2ban config to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/cards-db/docker-compose.yml,deploy/cards-db/pg_hba.conf,deploy/cards-db/fail2ban"
          target: ${{ env.PROJECT_DIR }}
          strip_components: 2

      # .env is assembled on the server from forwarded secrets, never on the runner's disk.
      # POSTGRES_PASSWORD must be URL-safe (e.g. `openssl rand -hex 24`): it is embedded in a URL.
      - name: Write .env on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          POSTGRES_USER: ${{ vars.CARDS_POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.CARDS_POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.CARDS_POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_DB,POSTGRES_PASSWORD
          script: |
            umask 077
            cat > "${{ env.PROJECT_DIR }}/.env" <<EOF
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            EOF
            chmod 600 "${{ env.PROJECT_DIR }}/.env"

      # Self-signed server cert, created once and kept (10 years). The app pins it as its CA
      # (DATABASE_CA in Vercel), so TLS is verified without a public CA. SAN covers the VPS IP
      # and a DNS name if one is ever added. Key must be owned by uid 70 (postgres) with 0600.
      - name: Ensure TLS certificate
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd ${{ env.PROJECT_DIR }}
            mkdir -p certs
            if [ ! -f certs/server.crt ]; then
              docker run --rm -v "$PWD/certs:/certs" --entrypoint sh alpine/openssl -c '
                openssl req -x509 -newkey rsa:3072 -nodes -days 3650 \
                  -keyout /certs/server.key -out /certs/server.crt \
                  -subj "/CN=cards-db.zephyron.tech" \
                  -addext "subjectAltName=DNS:cards-db.zephyron.tech,IP:77.42.45.121" &&
                chown 70:70 /certs/server.key /certs/server.crt &&
                chmod 600 /certs/server.key && chmod 644 /certs/server.crt'
              echo "=== New certificate generated. Put this in Vercel as DATABASE_CA: ==="
              cat certs/server.crt
            fi

      # The migrate image is a private GHCR package and this VPS has no standing login that can
      # read it, so log in with the run's short-lived GITHUB_TOKEN and log out again afterwards.
      - name: Pull, start Postgres, migrate
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd ${{ env.PROJECT_DIR }}
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull
            docker compose --profile migrate pull migrate
            # No --force-recreate: unlike stateless services, restarting the DB on every deploy
            # is pointless downtime. Compose recreates it only when its config/image changed.
            docker compose up -d --wait postgres
            docker compose run --rm migrate
            docker image prune -f
