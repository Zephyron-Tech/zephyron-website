# TYPE   DATABASE  USER  ADDRESS    METHOD
# Socket inside the container: healthcheck and first-boot init only.
local    all       all              trust
# Everything over the network must be TLS + SCRAM. No plain `host` rules on purpose.
hostssl  all       all   0.0.0.0/0  scram-sha-256
hostssl  all       all   ::/0       scram-sha-256
