# Matches Postgres rejections in Docker json-file logs (lines look like
#   {"log":"... [893] 1.2.3.4 FATAL:  password authentication failed ...\n","stream":"stderr",...}
# and `no pg_hba.conf entry for host \"1.2.3.4\"` for non-TLS probes). log_line_prefix in the
# compose file puts the client host (%h) before the level so the first form carries an IP.
[Definition]
failregex = FATAL:\s+no pg_hba\.conf entry for host \\"<HOST>\\"
            \[\d+\] <HOST> FATAL:\s+password authentication failed
            \[\d+\] <HOST> FATAL:\s+no pg_hba\.conf entry
ignoreregex =
